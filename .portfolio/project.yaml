# 这个项目的证据化清单：每项内容都指向仓库里的证据。校验：profile-atlas check .
schema: portfolio/project@1
id: langgraph-agentic-workflow
title: 多跳问答的证据访问路径：长上下文、RAG、物化视图与 Agent 的分界点
title_en: 'Access paths for multi-hop QA: long context vs RAG vs views'
kind: personal
role: solo
period:
  start: 2026-05
  end: 2026-11
visibility: public
status: done
summary: 实测前缀缓存时代长上下文、RAG、物化视图与 Agent 在多跳问答上的准确率、成本和分界点，并据此做覆盖感知的路径规划
problem: 多跳问答默认用 RAG，但百万级上下文加上前缀缓存（读价约为输入的 1/50）之后，“RAG 便宜、长上下文准”是否还成立、在哪个规模翻转， 没有人在同一组题上量过；先抽成表再查的物化视图便宜，却只能回答表结构预想到的问题，系统也不知道什么时候该放弃它。
questions:
- 语料从 3 万字涨到 300 万字时，各条访问路径的准确率、每题成本、延迟怎么变，分界点在哪？
- RAG 在多跳题上失败，是排序的问题还是连接的问题？
- 物化视图答不了表结构以外的问题时，规划器能不能事先知道并改走别的路径，代价是多少？
- 自托管长上下文用 KV 压缩省显存时，按问题挑 KV 会不会像 RAG 一样在连接题上崩，修复的收益从哪来？
techs:
- slug: retrieval-augmented-generation
  depth: core
- slug: long-context
  depth: core
- slug: prompt-caching
  depth: core
  note: 前缀缓存价格作为成本变量
- slug: multi-hop-question-answering
  depth: core
- slug: text-to-sql
  depth: used
  note: 在模型自建的事实表上写 SQL
- slug: agentic-search
  depth: used
  note: search / read 工具循环
- slug: tool-use
  depth: used
- slug: bm25
  depth: used
  note: jieba 分词
- slug: dense-retrieval
  depth: used
  note: FAISS + bge-base-zh
- slug: reciprocal-rank-fusion
  depth: used
- slug: cross-encoder-reranking
  depth: touched
  note: 早期版本的消融里证明它在多跳上有害
- slug: langgraph
  depth: touched
  note: 早期版本的自纠错图
- slug: self-rag
  depth: touched
- slug: kv-cache
  depth: used
  note: 延伸实验，用 kvpress 的 SnapKV / KeyDiff 在 H20 上按预算切 KV
contributions:
- what: 在同一组多跳题、四档语料规模（最多约 300 万字）上对比七条证据访问路径：全文、混合检索、检索加显式连接、模型读表、模型写 SQL、按需物化、工具 Agent
  why: 前缀缓存改变了长上下文的成本，需要在同一组题上重新量各条路径的准确率、成本和延迟
  techs:
  - long-context
  - retrieval-augmented-generation
  - prompt-caching
  - agentic-search
  evidence:
  - paths-code
  - base-180-scan
  - base-180-index
- what: 构造 52 道答案在语料里但不在视图表结构里的题，测物化视图在表外问题上怎么失败
  why: 视图的表结构总是照着已知问题设计的，只测已知问题会高估视图
  techs:
  - multi-hop-question-answering
  evidence:
  - oos-questions-code
  - oos-540-agent
- what: 做了一个按题型和表结构覆盖判断选路径的规划器，按记录重放，和单一路径、答 null 再升级、事后最优对比
  why: 把各条路径的分界点变成可执行的规则，并量出事先判断覆盖相对升级策略省多少钱
  techs:
  - text-to-sql
  - retrieval-augmented-generation
  evidence:
  - planner-code
  - planner-180-coverage
  - planner-180-escalate
- what: 实现按需物化：用现有事实表选出需要新字段的行，只对这些行的文档抽取，再用 SQL 作答
  why: 语料放不进上下文时，表外的行业聚合题 Agent 翻不完、视图又没有这一列
  techs:
  - text-to-sql
  evidence:
  - paths-code
  - oos-540-lazy
  - planner-540-lazy
- what: 把访问路径对比延伸到 KV 缓存层，用配对题和差中差拆出压缩带来的连接代价，用 join_key 消融定位重挑的收益来源
  why: RAG 在连接题上全是 0 分；SnapKV 用问题对上下文的注意力挑 KV，结构上和按问题检索一样，需要验证它是否同样失败
  techs:
  - kv-cache
  - long-context
  - multi-hop-question-answering
  evidence:
  - kv-code
  - kv-54-query-2
  - kv-54-join-key-2
decisions:
- choice: 换模型后整张表重跑，旧模型的结果单独保留，不混在一张表里
  why: 这台设备只能用 deepseek-v4.1-flash，混用两个模型版本的格子无法比较；旧结果用来核对结论是否依赖模型版本
  alternatives:
  - 只补缺的格子
  evidence:
  - base-180-index
- choice: 定位成实证研究加成本模型，不以新系统为卖点
  why: 语义算子、文档查询规划、RAG 与长上下文路由都已有大量系统工作，本项目的增量在实测的分界点、成本和失败模式
  alternatives:
  - 包装成新的规划器系统
  evidence:
  - readme-related
- choice: 物化视图用 SQL 查，而不是让模型读表
  why: 模型读 1,638 行的表做聚合会数错，而且每次运行结果不同
  alternatives:
  - 模型直接读表
  evidence:
  - stability-540
  - view-sql-iterations
findings:
- claim: 前缀缓存命中 98% 时，55 万 token 全文问答每题约 $0.0033，长上下文剩下的代价主要是延迟和窗口上限
  kind: insight
  evidence:
  - base-180-scan
- claim: RAG 在供应链题上所有规模都是 0 分，原因是连接键不在问题里而不是排序；显式连接在有干扰时只修到 0.62
  kind: negative
  evidence:
  - base-180-index
  - base-54-index-join
- claim: 540 家干扰时模型读事实表做聚合 4 次运行平均 0.5833，同一张表写 SQL 4 次都是 1.0
  kind: insight
  evidence:
  - stability-540
- claim: 模型写 SQL 的失败来自自由文本取值对不上，补上示例行、外键和取值目录后才稳定
  kind: pitfall
  evidence:
  - view-sql-iterations
- claim: 事先判断覆盖和答 null 再升级准确率相同，但升级每题贵约 46%，因为视图在缺列时会先长时间推理
  kind: insight
  evidence:
  - planner-180-coverage
  - planner-180-escalate
- claim: temperature 0 不确定：同一道聚合题重复 4 次，全文问答的平均准确率只有 0.8542，单次在 0.75 到 0.92 之间
  kind: pitfall
  evidence:
  - stability-180
  - stability-code
- claim: 自己的实现坑：带缓存的客户端里原样重试会命中缓存、等于没重试；选行的结果被展示用的 50 行上限截断
  kind: pitfall
  evidence:
  - retry-cap-code
  - readme-lazy-pitfall
- claim: 朴素 cross-encoder 重排在多跳上反而有害，会把间接相关的第二跳证据挤出 top-k
  kind: negative
  evidence:
  - results
- claim: 按问题挑 KV（SnapKV）的连接代价只在 2% 预算下显著（Qwen3-4B，20.5 万 token 时差中差 +0.41），5%–25% 下区间跨 0；问题 token 的注意力在任何一层给第二跳文档的排名都不如 BM25
  kind: insight
  evidence:
  - kv-54-query-2
  - kv-54-second-hop-rank
- claim: 用第一遍回答重新挑 KV 把 2% 预算下的连接题从 0.06 修到 0.50；删掉回答里的数字、只留公司名时仍是 0.44，收益主要来自说出连接键
  kind: insight
  evidence:
  - kv-54-join-2
  - kv-54-join-key-2
