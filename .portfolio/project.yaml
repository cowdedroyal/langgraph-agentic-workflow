      - "Rank-based, so the very different score scales of dense (cosine) and BM25 (tf-idf) combine cleanly."
  - id: hybrid-code
    type: file
    path: src/agentic_rag/retrieval/hybrid.py
    quote: ["fused = rrf_fuse([dense_hits, bm25_hits], k=s.rrf_k)"]
  - id: filter-code
    type: file
    path: src/agentic_rag/retrieval/hybrid.py
    quote: ["When a metadata filter is active, probe wider so filtering does not discard"]
  - id: rewards-code
