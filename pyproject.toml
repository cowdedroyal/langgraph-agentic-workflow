[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-finance"
version = "0.2.0"
description = "Financial multi-hop Agentic RAG: LangGraph self-correction + hybrid retrieval + evaluation + LoRA/GRPO post-training + vLLM/Ray serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agentic-rag-finance" }]
keywords = ["rag", "langgraph", "agent", "finance", "retrieval", "lora", "grpo", "vllm"]

# Core RAG runtime (P0-P4). Heavy training/serving deps live in optional groups below
# so the online RAG path never has to pull torch-cuda/vllm just to answer a question.
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    "langchain-ollama>=1.0",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "sentence-transformers>=3.0",
    "langchain-huggingface>=0.1",
    "pydantic>=2.5",
    "rich>=13",
    "typer>=0.12",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "numpy",
]

[project.optional-dependencies]
# P5/P6 — install AFTER core. torch should match the local CUDA (12.x): see requirements-train.txt
train = ["torch>=2.1", "transformers>=4.47", "peft>=0.13", "trl>=0.14", "accelerate>=1.0", "datasets>=2.20", "bitsandbytes>=0.43"]
# P7 — vLLM is sensitive to the torch build; install last / isolated if it conflicts.
serve = ["vllm>=0.6", "langchain-openai>=0.2", "openai>=1.40"]
# P8 — Ray for parallel ingestion / benchmarking.
ray = ["ray>=2.30"]
# Optional web-search fallback branch.
web = ["langchain-tavily>=0.1"]
dev = ["pytest>=7"]

[project.scripts]
arag = "agentic_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
