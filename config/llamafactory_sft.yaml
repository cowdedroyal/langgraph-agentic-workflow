# Production-scale SFT via LLaMA-Factory (roadmap P5 names this framework).
# Run:
#   1) register data/train/sft_sharegpt.jsonl in LLaMA-Factory's data/dataset_info.json:
#        "finance_multihop": { "file_name": ".../sft_sharegpt.jsonl", "formatting": "sharegpt" }
#   2) llamafactory-cli train config/llamafactory_sft.yaml
#
# This mirrors training/sft_lora.py (trl) but uses LLaMA-Factory for the full 7B run.

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: finance_multihop
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/llamafactory_sft_qwen7b
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
